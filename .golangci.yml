version: "2"
run:
  timeout: 5m
  build-tags:
    - acceptance
    - integration
linters:
  default: none
  enable:
    - gosec
    - errcheck
    - bodyclose
    - govet
    - staticcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]
      - path: test/acceptance/
        linters: [gosec]
        text: G204 # the suite drives docker compose by design
formatters:
  enable:
    - gofmt
