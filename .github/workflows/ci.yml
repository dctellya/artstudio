name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runs-on is pinned to ubuntu-24.04 on purpose (ubuntu-latest drifts to Ubuntu 26
# on 2026-10-19); bump it deliberately, not silently.
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: artstudio
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: artstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artstudio -d artstudio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://artstudio:ci-ephemeral@localhost:5432/artstudio?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      - run: go test -race -cover ./...
      - name: Lint OpenAPI contract (vacuum)
        run: docker run --rm -v "$PWD:/work:ro" dshanley/vacuum:v0.33.0 lint -d /work/api/openapi.yaml
      - name: Integration tests
        run: go test -race -count=1 -tags integration -run 'Integration|TestMigrateIdempotent|TestBatchInsertLandsRows|TestPoolMetricsRegistered|TestBadRowDoesNotLoseBatch|TestVendorFault' ./internal/...

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ''
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    needs: [test, scan, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/artstudio
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
      - name: Lowercase image ref
        run: echo "REF=${IMAGE,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REF }}
          version: v0.76.0
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REF }}
          syft-version: v1.54.1
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image (keyless)
        run: cosign sign --yes "$REF"
      # A package first created by GITHUB_TOKEN is private; the owner makes it
      # public once, after which this proves anonymous pull.
      - name: Anonymous pull
        continue-on-error: true
        run: |
          docker logout ghcr.io
          docker pull "$REF"

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # checkov 3.3.29 has no docker_compose framework: compose.yaml is not
      # scanned here (compose is covered by `docker compose config` locally).
      - uses: bridgecrewio/checkov-action@v12.3134.0
        with:
          directory: .
          framework: dockerfile,github_actions
          soft_fail: false # no skip_check: checkov 3.3.29 reports 0 failures on Dockerfile + workflows
      - name: Validate observability config
        if: hashFiles('deploy/obs/validate.sh') != ''
        run: make obs-validate
